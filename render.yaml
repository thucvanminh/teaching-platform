services:
  - type: web
    name: teachflow-api
    runtime: docker
    rootDir: backend/TeachFlow.Api
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Supabase__JwtSecret
        sync: false
      - key: Supabase__Url
        value: https://fsfzrbtmhfhbrwnmwtfc.supabase.co
      - key: Supabase__AnonKey
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: FrontendUrl
        sync: false

  - type: static_sites
    name: teachflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://fsfzrbtmhfhbrwnmwtfc.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
