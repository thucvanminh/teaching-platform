<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LessonOrbit · Teaching Mission Control</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🚀</span>
      <div class="brand-text">
        <h1>Lesson<span>Orbit</span></h1>
        <p class="brand-sub">teaching mission control</p>
      </div>
    </div>

    <nav class="tabs" aria-label="Main navigation">
      <button class="tab active" data-action="switch-view" data-view="dashboard">🛰️ Dashboard</button>
      <button class="tab" data-action="switch-view" data-view="lessons">📚 Lessons</button>
    </nav>

    <div class="header-right">
      <label class="select-wrap" title="Track progress for one student or the whole class">
        <span>🔭 Cadet</span>
        <select id="student-filter">
          <option value="all">Whole class</option>
        </select>
      </label>
    </div>
  </header>

  <main id="app"><!-- rendered by app.js --></main>

  <!-- Full-screen lesson viewer -->
  <div class="overlay hidden" id="viewer" role="dialog" aria-modal="true" aria-label="Lesson viewer">
    <div class="viewer-shell">
      <aside class="viewer-side" id="viewer-side"><!-- rendered --></aside>
      <div class="viewer-main">
        <iframe id="viewer-frame" title="Lesson content"></iframe>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>🪐 New school day? Drop your <code>lesson.html</code> into the <code>lessons/</code> folder and add one line to
      <code>lessons/manifest.js</code> — full walkthrough in <code>README.md</code>.</p>
  </footer>

  <script src="lessons/manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
